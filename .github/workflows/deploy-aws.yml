name: Deploy DevAtlas to AWS

on:
  workflow_run:
    workflows:
      - Publish DevAtlas container for AWS
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: devatlas-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Nurdauleterbool/devatlas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.AWS_ROLE_ARN }}"
          test -n "$INSTANCE_ID"
          [[ "$INSTANCE_ID" == i-* ]]

      - name: Verify latest main commit
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/Nurdauleterbool/devatlas/commits/main --jq .sha)
          test "$LATEST" = "$IMAGE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Deploy immutable image with rollback on failed health check
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/nurdauleterbool/devatlas:${IMAGE_SHA}"

          cat > deploy.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/devatlas
          ENV_FILE=/opt/devatlas/.env.aws
          COMPOSE=cloud/aws/compose.aws.yaml
          test -f "$ENV_FILE"
          grep -q '^APP_IMAGE=' "$ENV_FILE"
          grep -q '^DOMAIN=' "$ENV_FILE"

          # Keep credentials on the instance. Never print the env file.
          umask 077
          cp "$ENV_FILE" /opt/devatlas/.env.aws.rollback

          rollback() {
            trap - ERR
            echo "Deployment failed; restoring previous app image"
            cp /opt/devatlas/.env.aws.rollback "$ENV_FILE"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE" up -d --no-build devatlas || true
            exit 1
          }
          trap rollback ERR

          # Pull the new app image before changing the running configuration.
          docker pull IMAGE_PLACEHOLDER
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=IMAGE_PLACEHOLDER|' "$ENV_FILE"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE" up -d --no-build devatlas

          DOMAIN=$(sed -n 's/^DOMAIN=//p' "$ENV_FILE")
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${DOMAIN}/api/v1/health" | grep -q '"status":"ok"'

          trap - ERR
          rm -f /opt/devatlas/.env.aws.rollback
          echo "Deployment health check succeeded"
          SCRIPT

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" deploy.sh

          python3 - <<'PY'
          import json
          with open("deploy.sh", encoding="utf-8") as f:
              script = f.read()
          with open("command.json", "w", encoding="utf-8") as f:
              json.dump({"commands": [script]}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://command.json \
            --comment "DevAtlas deploy after successful CI and GHCR publication" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID"

      - name: Show deployment status
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode}' --output json
