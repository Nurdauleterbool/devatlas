
name: Deploy DevAtlas to AWS

on:
  workflow_run:
    workflows:
      - Publish DevAtlas container for AWS
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: devatlas-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Nurdauleterbool/devatlas'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify latest main commit
        shell: bash
        run: |
          LATEST=$(gh api repos/Nurdauleterbool/devatlas/commits/main --jq .sha)
          test "$LATEST" = "$IMAGE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy container using SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/nurdauleterbool/devatlas:${IMAGE_SHA}"

          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          cd /opt/devatlas
          ENV_FILE=/opt/devatlas/.env.aws
          COMPOSE=cloud/aws/compose.aws.yaml

          test -f "$ENV_FILE"

          cp "$ENV_FILE" /opt/devatlas/.env.aws.backup
          chmod 600 /opt/devatlas/.env.aws.backup

          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=IMAGE_PLACEHOLDER|" "$ENV_FILE"

          docker compose --env-file "$ENV_FILE" -f "$COMPOSE" pull devatlas
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE" up -d --no-build devatlas

          DOMAIN=$(sed -n 's/^DOMAIN=//p' "$ENV_FILE")

          curl --fail --retry 12 --retry-all-errors \
            --retry-delay 5 \
            "https://${DOMAIN}/api/v1/health"

          echo "Deployment completed"
          SCRIPT

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|" deploy.sh

          python3 - <<'PY'
          import json
          with open("deploy.sh") as f:
              script = f.read()
          with open("command.json", "w") as f:
              json.dump({"commands": [script]}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://command.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID"

      - name: Check deployment status
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode}' \
            --output json
