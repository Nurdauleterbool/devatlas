name: Deploy DevAtlas to AWS development (after CI)
on:
  workflow_run:
    workflows: ["Publish DevAtlas container for AWS"]
    types: [completed]
permissions:
  contents: read
  id-token: write
concurrency:
  group: devatlas-aws-development
  cancel-in-progress: false
jobs:
  development:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Nurdauleterbool/devatlas'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.AWS_DEV_INSTANCE_ID }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check development target and release
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.AWS_ROLE_ARN }}"
          [[ "$INSTANCE_ID" == i-* ]]
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest=$(gh api repos/Nurdauleterbool/devatlas/commits/main --jq .sha)
          test "$latest" = "$IMAGE_SHA"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy to development using SSM
        shell: bash
        run: |
          set -euo pipefail
          cat > script.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/devatlas
          envfile=/opt/devatlas/.env.aws
          compose=cloud/aws/compose.aws.yaml
          test -f "$envfile"
          grep -q '^APP_IMAGE=' "$envfile"
          cp "$envfile" /opt/devatlas/.env.aws.rollback
          rollback() {
            trap - ERR
            cp /opt/devatlas/.env.aws.rollback "$envfile"
            docker compose --env-file "$envfile" -f "$compose" up -d --no-build devatlas || true
            exit 1
          }
          trap rollback ERR
          image="ghcr.io/nurdauleterbool/devatlas:__IMAGE_SHA__"
          docker pull "$image"
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$image|" "$envfile"
          docker network inspect devatlas-telemetry >/dev/null 2>&1 || docker network create devatlas-telemetry
          docker compose --env-file "$envfile" -f "$compose" up -d --no-build devatlas
          domain=$(sed -n 's/^DOMAIN=//p' "$envfile")
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${domain}/api/v1/health" | grep -q '"status":"ok"'
          rm -f /opt/devatlas/.env.aws.rollback
          SCRIPT
          sed -i "s/__IMAGE_SHA__/$IMAGE_SHA/g" script.sh
          python3 - <<'PY'
          import json
          json.dump({'commands':[open('script.sh').read()]},open('command.json','w'))
          PY
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://command.json --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID"
          code=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query 'ResponseCode' --output text)
          test "$code" = 0
