name: Production promotion safety checks (no AWS)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/promote-production.yml'
      - '.github/workflows/production-promotion-safety-ci.yml'
      - 'tests/test_production_promotion_safety.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-production.yml'
      - '.github/workflows/production-promotion-safety-ci.yml'
      - 'tests/test_production_promotion_safety.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-no-production-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate manual-only workflow, scoped roles, approval and rollback
        run: python -m unittest discover -s tests -p 'test_production_promotion_safety.py' -v
