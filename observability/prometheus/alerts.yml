groups:
  - name: devatlas-business
    rules:
      - alert: DevAtlasQuizFailuresHigh
        expr: sum(rate(devatlas_quiz_submissions_total{outcome="failed"}[5m])) / clamp_min(sum(rate(devatlas_quiz_submissions_total[5m])), 0.001) > 0.5 and sum(increase(devatlas_quiz_submissions_total[5m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Quiz failure ratio exceeded 50% over five minutes
          runbook: Check quiz release changes, API traces and safe aggregated logs
      - alert: DevAtlasTelemetryMissing
        expr: absent(devatlas_quiz_submissions_total) and absent(devatlas_progress_changes_total)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No business telemetry series received for 30 minutes
          runbook: Verify application instrumentation, traffic, and collector connectivity; absent traffic may be normal
