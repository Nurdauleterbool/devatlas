        feedback:
        - questionId: html-q1
          selectedOptionId: html-q1-o2
          correctOptionId: html-q1-o2
          correct: true
          explanation: The main element identifies the dominant content of the document.
        - questionId: html-q2
          selectedOptionId: html-q2-o4
          correctOptionId: html-q2-o4
          correct: true
          explanation: A label uses for to reference the input id.
        - questionId: html-q3
          selectedOptionId: html-q3-o1
          correctOptionId: html-q3-o1
          correct: true
