    Recommendation:
      type: object
      additionalProperties: false
      required:
      - careerId
      - skillId
      - rank
      - priority
      - prerequisiteIds
      - reason
      properties:
        careerId:
          $ref: '#/components/schemas/Id'
        skillId:
          $ref: '#/components/schemas/Id'
        rank:
          type: integer
          minimum: 1
          example: 1
        priority:
          type: string
          enum:
          - continue_learning
          - start_next
          example: continue_learning
        prerequisiteIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          example:
          - html
          uniqueItems: true
        reason:
          type: string
          example: 'Continue learning CSS; prerequisites completed or verified: HTML.'
          minLength: 1
      description: Deterministic eligible next skill for one career. Exclude completed or verified skills
        and any skill with unsatisfied direct prerequisites. Eligible learning skills precede new skills;
        authored career order breaks ties. Rank starts at one; each recommendation includes an explainable
        reason.
      example:
        careerId: frontend
        skillId: css
        rank: 1
        priority: continue_learning
        prerequisiteIds:
        - html
        reason: 'Continue learning CSS; prerequisites completed or verified: HTML.'
    SelectCareersInput:
      type: object
      additionalProperties: false
      required:
      - careerIds
      properties:
        careerIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          example:
          - frontend
          - analyst
          uniqueItems: true
      description: Replace the current authenticated user's complete selected-career set. All IDs must
        exist and be unique. An empty array clears selections. Reject the complete request before changing
        state if any ID is invalid; the client cannot submit userId.
      example:
        careerIds:
        - frontend
        - analyst
    UpdateProgressBody:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - not_started
          - learning
          - completed
          description: Self-assessed learning status. Any transition is allowed; quiz verification is
            independent.
          example: learning
      description: Set the current user's self-assessed status for the skill ID in the path. All transitions
        are allowed. The server records a dated event only for an actual change. skillId is supplied in
        the path; userId, verified, best score and timestamps are forbidden request fields.
      example:
        status: learning
    SubmitQuizBody:
      type: object
      additionalProperties: false
      required:
      - responses
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/QuizResponse'
          example:
          - questionId: html-q1
            optionId: html-q1-o2
          - questionId: html-q2
            optionId: html-q2-o4
          - questionId: html-q3
            optionId: html-q3-o1
          - questionId: html-q4
            optionId: html-q4-o1
          - questionId: html-q5
            optionId: html-q5-o1
          minItems: 5
          maxItems: 10
          uniqueItems: true
      description: Submit exactly one selected option per question for the quiz ID in the path. Question
        IDs must be unique and options must belong to their questions. The server validates the complete
        request, grades it and stores one current-user attempt atomically. quizId is supplied in the path;
        userId, score, passed, correctCount, answer keys and timestamps are forbidden request fields.
      example:
        responses:
        - questionId: html-q1
          optionId: html-q1-o2
        - questionId: html-q2
          optionId: html-q2-o4
        - questionId: html-q3
          optionId: html-q3-o1
        - questionId: html-q4
          optionId: html-q4-o1
        - questionId: html-q5
          optionId: html-q5-o1
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - VALIDATION
              - NOT_FOUND
              - UNAVAILABLE
              - INVALID_CREDENTIALS
              - EMAIL_IN_USE
              - UNAUTHENTICATED
              - FORBIDDEN
              example: UNAUTHENTICATED
            message:
              type: string
              example: Sign in to access your personal learning data.
              minLength: 1
          description: Stable API error code and safe human-readable message; never include stack traces,
            credentials or quiz grading keys.
          example:
            code: UNAUTHENTICATED
            message: Sign in to access your personal learning data.
      description: Consistent API error envelope. HTTP status identifies the class of failure. SESSION_CHANGED
        is a client/mock lifecycle error and is not a server code. Validate unsupported fields and ownership
        before mutation; errors never imply a partially stored attempt.
      example:
        error:
          code: UNAUTHENTICATED
          message: Sign in to access your personal learning data.
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
      example:
        status: ok
