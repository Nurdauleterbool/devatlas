      example:
        questionId: html-q1
        optionId: html-q1-o2
    QuizAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - quizId
      - skillId
      - responses
      - correctCount
      - totalQuestions
      - score
      - passed
      - submittedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        quizId:
          $ref: '#/components/schemas/Id'
        skillId:
          $ref: '#/components/schemas/Id'
        responses:
          type: array
          items:
            $ref: '#/components/schemas/QuizResponse'
          example:
          - questionId: html-q1
            optionId: html-q1-o2
          - questionId: html-q2
            optionId: html-q2-o4
          - questionId: html-q3
            optionId: html-q3-o1
          - questionId: html-q4
            optionId: html-q4-o1
          - questionId: html-q5
            optionId: html-q5-o1
          minItems: 5
          maxItems: 10
          uniqueItems: true
        correctCount:
          type: integer
          minimum: 0
          example: 3
          maximum: 10
        totalQuestions:
          type: integer
          minimum: 5
          example: 5
          maximum: 10
        score:
          type: integer
          minimum: 0
          example: 60
          maximum: 100
        passed:
          type: boolean
          example: false
        submittedAt:
          $ref: '#/components/schemas/Timestamp'
      description: Retained current-user attempt graded by the server. totalQuestions equals this quiz
        question count; 0 <= correctCount <= totalQuestions; score is round(correctCount/totalQuestions*100).
        passed uses the exact ratio >= 0.8. All valid retakes are retained; owner and scores are never
        supplied by clients. Response question IDs are unique and cover the complete quiz.
      example:
        id: attempt-1
        userId: user-1
        quizId: quiz-html
        skillId: html
        responses:
        - questionId: html-q1
          optionId: html-q1-o2
        - questionId: html-q2
          optionId: html-q2-o4
        - questionId: html-q3
          optionId: html-q3-o1
        - questionId: html-q4
          optionId: html-q4-o1
        - questionId: html-q5
          optionId: html-q5-o1
        correctCount: 3
        totalQuestions: 5
        score: 60
        passed: false
        submittedAt: '2026-10-20T12:00:00.000Z'
